

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Changed | BankGuard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #ffffff;
            background:
                radial-gradient(circle at top left, #164e8a 0%, transparent 38%),
                radial-gradient(circle at bottom right, #075985 0%, transparent 35%),
                linear-gradient(135deg, #06152f, #0b2d5c 55%, #06152f);
            overflow-x: hidden;
            position: relative;
        }

        .background-circle {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.07);
            filter: blur(2px);
            animation: float 7s ease-in-out infinite;
            pointer-events: none;
        }

        .circle-one {
            top: -100px;
            right: -80px;
        }

        .circle-two {
            bottom: -130px;
            left: -90px;
            animation-delay: 2s;
        }

        .success-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 42px 35px;
            text-align: center;
            border: 1px solid rgba(148, 197, 255, 0.2);
            border-radius: 24px;
            background: rgba(10, 31, 65, 0.88);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            animation: appear 0.7s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 30px;
        }

        .brand-icon {
            width: 47px;
            height: 47px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            color: #ffffff;
            font-size: 25px;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.35);
            animation: shieldPulse 2.5s infinite;
        }

        .brand-name {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .brand-name span {
            color: #38bdf8;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: #a8c2e8;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: left;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            border: 1px solid rgba(52, 211, 153, 0.35);
            border-radius: 50%;
            color: #34d399;
            font-size: 47px;
            background: rgba(16, 185, 129, 0.12);
            box-shadow: 0 0 35px rgba(52, 211, 153, 0.12);
            animation: successPop 0.65s ease;
        }

        h1 {
            margin-bottom: 14px;
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
        }

        .description {
            margin-bottom: 27px;
            color: #b8c9e3;
            font-size: 14px;
            line-height: 1.8;
        }

        .security-note {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 25px;
            padding: 13px 15px;
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-radius: 12px;
            color: #c5ddf8;
            background: rgba(56, 189, 248, 0.07);
            font-size: 12px;
            line-height: 1.6;
            text-align: left;
        }

        .security-note i {
            margin-top: 2px;
            color: #38bdf8;
            font-size: 17px;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .login-btn:hover {
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
        }

        .login-btn i {
            margin-right: 7px;
        }

        .footer-text {
            margin-top: 25px;
            color: #7f9abd;
            font-size: 11px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes successPop {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            70% {
                transform: scale(1.12);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shieldPulse {
            0%, 100% {
                box-shadow: 0 8px 22px rgba(37, 99, 235, 0.35);
            }
            50% {
                box-shadow: 0 8px 30px rgba(56, 189, 248, 0.55);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 480px) {
            .success-card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <main class="success-card">

        <!-- BankGuard Logo -->
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <div>
                <div class="brand-name">
                    Bank<span>Guard</span>
                </div>
                <div class="brand-subtitle">EMAIL SECURITY</div>
            </div>
        </div>

        <!-- Success Icon -->
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <h1>Password Changed!</h1>

        <p class="description">
            Your password has been changed successfully.
            Your BankGuard account is ready to use with your new password.
        </p>

        <div class="security-note">
            <i class="bi bi-shield-check"></i>
            <div>
                <strong>Security reminder</strong><br>
                Keep your password private and never share it with anyone.
            </div>
        </div>

        <a href="{% url 'login' %}" class="login-btn">
            <i class="bi bi-box-arrow-in-right"></i>
            Login to BankGuard
        </a>

        <div class="footer-text">
            <i class="bi bi-shield-lock"></i>
            Protected by BankGuard Email Security
        </div>

    </main>

</body>
</html>
